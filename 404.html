<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>روايات صمت — Silence Novels</title>
    <script>
      // SPA fallback: احفظ المسار المطلوب ثم أعد التوجيه إلى index.html في نفس المجلد
      (function () {
        try {
          var path = location.pathname + location.search + location.hash;
          sessionStorage.setItem('sn_redirect', path);
        } catch (e) {}
        var base = location.pathname.replace(/\/[^/]*$/, '/');
        location.replace(base + 'index.html');
      })();
    </script>
  <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
  <body></body>
</html>
