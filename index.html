    <script>
      // احسب جذر التطبيق (يدعم النشر تحت مسار فرعي) ثم استعد المسار المحفوظ من 404.html
      (function () {
        try {
          var p = location.pathname;
          var base = p.replace(/index\.html$/, '');
          window.__SN_BASE__ = base || '/';
          var r = sessionStorage.getItem('sn_redirect');
          if (r) {
            sessionStorage.removeItem('sn_redirect');
            history.replaceState(null, '', r);
          }
        } catch (e) {
          window.__SN_BASE__ = '/';
        }
      })();
    </script>
